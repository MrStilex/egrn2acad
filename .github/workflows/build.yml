name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name egrn2acad egrn2acad.py
      - name: Smoke test
        run: dist\egrn2acad.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: egrn2acad-windows
          path: dist/egrn2acad.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/egrn2acad.exe
